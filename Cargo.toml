[package]
name = "cs"
version = "0.0.1"
edition = "2021"
description = "Switch between Claude Code accounts"
license = "MIT"
repository = "https://github.com/carlosarraes/cs"

[[bin]]
name = "cs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
dirs = "5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
